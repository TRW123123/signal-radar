# Lädt historische Antworten für den Backtest (backtest/history-queue.json) und legt sie als Fixtures ab.
# Startet von Hand oder wenn sich die Liste ändert. Schreibt nur unter fixtures/backtest/.
# Abruf und Commit sind getrennte Jobs: nur der Commit-Job darf pushen, und er hat keine Sammel-Secrets.
name: backfill
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'backtest/history-queue.json'
      - 'scripts/fetch_queue.ts'
      - '.github/workflows/backfill.yml'
# Jobs setzen ihre Rechte selbst. fetch bleibt lesend; nur commit darf schreiben.
permissions:
  contents: write
concurrency:
  group: backfill
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Fetch history
        run: node scripts/fetch_queue.ts backtest/history-queue.json
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          SR_SEC_USER_AGENT: ${{ secrets.SR_SEC_USER_AGENT }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backfill-fixtures
          retention-days: 1
          if-no-files-found: error
          path: fixtures/backtest
  commit:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backfill-fixtures
          path: backfill-in
      - name: Commit fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          src=backfill-in/fixtures/backtest
          if [ ! -d "$src" ]; then src=backfill-in/backtest; fi
          test -d "$src"
          rm -rf fixtures/backtest
          mkdir -p fixtures
          cp -a "$src" fixtures/backtest
          git config user.name "signal-radar-bot"
          git config user.email "signal-radar-bot@users.noreply.github.com"
          git add -f fixtures/backtest
          git diff --cached --quiet && exit 0
          git commit -m "backfill: historische Antworten $(date -u +%Y-%m-%dT%H:%MZ)"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
          unset auth
          for i in 1 2 3; do
            git pull --rebase --autostash "https://github.com/${GITHUB_REPOSITORY}.git" master && git push "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:master && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i * 5))
          done
          exit 1
