/* ---------- Tokens: Papier (hell, Standard) ---------- */
:root {
  color-scheme: light dark;
  --papier: #f4f1ea;
  --band: #ebe7dc;
  --band-tief: #e2ddd0;
  --tinte: #1c1f23;
  --grau: #575d63;
  --linie: #c9c2b2;
  --linie-fein: #dcd6c9;
  --tag: #d3cdbf;
  --l0: #5f656b;
  --l1: #1f6a8a;
  --l2: #8a5a00;
  --l3: #b1431a;
  --l4: #a3162b;
  --att: #6e3a9a;
  --auf-farbe: #ffffff;
  --ruhig-fill: color-mix(in srgb, var(--tinte) 16%, transparent);
  --att-leicht: color-mix(in srgb, var(--att) 35%, transparent);

  --sans: 'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Martian Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;

  --t-12: 0.75rem;
  --t-14: 0.875rem;
  --t-16: 1rem;
  --t-18: 1.125rem;
  --t-22: 1.375rem;
  --t-28: 1.75rem;
  --t-zahl: clamp(4rem, 2.6rem + 6vw, 7.5rem);

  --r-4: 0.25rem;
  --r-8: 0.5rem;
  --r-12: 0.75rem;
  --r-16: 1rem;
  --r-24: 1.5rem;
  --r-32: 2rem;
  --r-48: 3rem;

  --rand: clamp(0.75rem, 0.4rem + 1.8vw, 2.5rem);
  --spalte-name: 13.5rem;
  --spalte-jetzt: 7.25rem;
  --bahn-h: 3rem;
  --radius: 3px;
}

/* ---------- Tokens: Nachtschicht (dunkel) ---------- */
@media (prefers-color-scheme: dark) {
  :root {
    --papier: #121519;
    --band: #191d22;
    --band-tief: #20252b;
    --tinte: #e9e5dc;
    --grau: #a4aab0;
    --linie: #3a4048;
    --linie-fein: #2a2f36;
    --tag: #2c3138;
    --l0: #9aa0a6;
    --l1: #6db4d8;
    --l2: #dfa73e;
    --l3: #f08454;
    --l4: #ff7a88;
    --att: #c4a0ee;
    --auf-farbe: #121519;
    --ruhig-fill: color-mix(in srgb, var(--tinte) 22%, transparent);
    --att-leicht: color-mix(in srgb, var(--att) 40%, transparent);
  }
}

/* ---------- Grundlagen ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--papier);
  color: var(--tinte);
  font-family: var(--sans);
  font-size: var(--t-16);
  line-height: 1.5;
  font-kerning: normal;
  overflow-wrap: break-word;
}
h1, h2, h3, h4, p, ul, dl, dd, figure { margin: 0; }
ul { padding: 0; list-style: none; }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 0.2em; }
a:hover { text-decoration-thickness: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--tinte); outline-offset: 2px; border-radius: 1px; }
.nur-vorleser {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.sprung { position: absolute; left: var(--r-8); top: -4rem; z-index: 10; background: var(--tinte); color: var(--papier); padding: var(--r-8) var(--r-12); }
.sprung:focus { top: var(--r-8); }
.zahl-mono { font-family: var(--mono); font-variant-numeric: tabular-nums; font-stretch: 87.5%; }

.seite { max-width: 90rem; margin: 0 auto; padding: 0 var(--rand) var(--r-48); }

/* ---------- Betriebsart ---------- */
.betrieb {
  border-bottom: 1px solid var(--tinte);
  background:
    repeating-linear-gradient(135deg, transparent 0 9px, color-mix(in srgb, var(--tinte) 7%, transparent) 9px 10px),
    var(--band);
}

  font-size: var(--t-14); line-height: 1.4;
}
.betrieb strong {
  font-family: var(--mono); font-stretch: 87.5%; font-size: var(--t-12); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  border: 1.5px solid var(--tinte); padding: 0.1rem 0.45rem; margin-right: 0.4rem; background: var(--papier); white-space: nowrap;
}
.betrieb-notiz { color: var(--grau); }

/* ---------- Kopf ---------- */
.kopf { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--r-4) var(--r-24); padding: var(--r-16) 0 var(--r-12); }
.marke { display: flex; align-items: center; gap: 0.55rem; font-family: var(--mono); font-weight: 600; font-size: var(--t-16); letter-spacing: -0.01em; }

.mz-a { stroke: var(--l3); }
.stand { font-family: var(--mono); font-stretch: 87.5%; font-size: var(--t-12); color: var(--grau); }
.live-marke { color: var(--tinte); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
.veraltet {
  border: 1.5px solid var(--tinte); border-left-width: 6px; padding: var(--r-12) var(--r-16); margin-bottom: var(--r-16);
  font-weight: 600; background: var(--band);
}

/* ---------- Szenario-Wahl ---------- */
.wahl-rahmen { border-top: 1px solid var(--tinte); border-bottom: 1px solid var(--linie); margin-bottom: var(--r-24); }
.wahl {
  display: flex; gap: 0; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: thin;
  margin: 0 calc(-1 * var(--r-4)); padding: 0 var(--r-4);
}
.wahl-knopf {
  flex: none; display: grid; gap: 0.2rem; text-align: left; cursor: pointer;
  min-height: 3.5rem; padding: var(--r-8) var(--r-16) calc(var(--r-8) + 3px);
  background: none; border: 0; border-right: 1px solid var(--linie-fein);
  position: relative;
}
.wahl-knopf:first-child { padding-left: var(--r-4); }
.wahl-knopf::after { content: ''; position: absolute; left: var(--r-4); right: var(--r-16); bottom: 0; height: 3px; background: transparent; }
.wahl-knopf:first-child::after { left: var(--r-4); }
.wahl-knopf[aria-selected='true']::after { background: var(--tinte); }
.wahl-knopf[aria-selected='true'] .wahl-titel { font-weight: 700; }
.wahl-knopf:hover .wahl-titel { text-decoration: underline; text-underline-offset: 0.2em; }
.wahl-knopf:focus-visible { outline-offset: -3px; }
.wahl-titel { font-size: var(--t-16); white-space: nowrap; }
@media (min-width: 68rem) {
  .wahl-knopf { flex: 0 1 auto; min-width: 0; padding-right: var(--r-12); }
  .wahl-titel { white-space: normal; line-height: 1.2; }
}
.wahl-stufe { display: flex; align-items: center; gap: 0.45rem; font-family: var(--mono); font-stretch: 87.5%; font-size: var(--t-12); color: var(--grau); white-space: nowrap; }
.w-l1 .wahl-stufe { color: var(--l1); } .w-l2 .wahl-stufe { color: var(--l2); }
.w-l3 .wahl-stufe { color: var(--l3); } .w-l4 .wahl-stufe { color: var(--l4); }
.mini { display: inline-flex; align-items: flex-end; gap: 2px; }
.mini i { width: 5px; border: 1px solid currentColor; display: block; }
.mini i:nth-child(1) { height: 6px; } .mini i:nth-child(2) { height: 9px; } .mini i:nth-child(3) { height: 12px; } .mini i:nth-child(4) { height: 15px; }
.mini i.an { border-color: transparent; }
.mini-wenig i { border-style: dashed; }
.wahl-kommend { font-size: var(--t-12); color: var(--grau); padding: 0 0 var(--r-8); font-family: var(--mono); font-stretch: 87.5%; }

/* Stufenfarben als Füllung (SVG und HTML) */
.f-l0 { fill: var(--l0); } .f-l1 { fill: var(--l1); } .f-l2 { fill: var(--l2); } .f-l3 { fill: var(--l3); } .f-l4 { fill: var(--l4); }
.f-bg-l0 { background: var(--l0); } .f-bg-l1 { background: var(--l1); } .f-bg-l2 { background: var(--l2); } .f-bg-l3 { background: var(--l3); } .f-bg-l4 { background: var(--l4); }

/* ---------- Lage: Raster ---------- */
.lage { display: grid; gap: var(--r-32); grid-template-columns: minmax(0, 1fr); grid-template-areas: 'aussage' 'spuren' 'belege' 'kontext'; }
.kontext { grid-area: kontext; min-width: 0; }
.aussage { grid-area: aussage; }
.spuren { grid-area: spuren; min-width: 0; container-type: inline-size; }
.belege { grid-area: belege; min-width: 0; }

@media (min-width: 68rem) {
  .lage { grid-template-columns: minmax(0, 1fr) 21rem; grid-template-areas: 'spuren aussage' 'belege aussage' 'kontext aussage'; column-gap: var(--r-48); row-gap: var(--r-48); align-items: start; }
  .aussage { position: sticky; top: var(--r-16); border-left: 2px solid var(--tinte); padding-left: var(--r-24); }
}

/* ---------- Aussage ---------- */
.zaehler { display: flex; align-items: flex-end; gap: var(--r-12); }
.zahl {
  font-family: var(--mono); font-weight: 700; font-stretch: 87.5%; font-size: var(--t-zahl); line-height: 0.82;
  font-variant-numeric: tabular-nums; letter-spacing: -0.04em; color: var(--tinte);
}
.zahl-text { font-size: var(--t-18); line-height: 1.25; padding-bottom: 0.15rem; max-width: 12rem; }
.ohne-daten { font-size: var(--t-14); color: var(--grau); margin-top: var(--r-8); }
.stufe {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 var(--r-12); margin-top: var(--r-16);
  border-left: 6px solid var(--l0); padding-left: var(--r-12);
}
.stufe-nr { font-family: var(--mono); font-stretch: 87.5%; font-size: var(--t-14); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.stufe-name { font-size: var(--t-28); font-weight: 700; line-height: 1.2; }
.a-l1 .stufe { border-color: var(--l1); color: var(--l1); }
.a-l2 .stufe { border-color: var(--l2); color: var(--l2); }
.a-l3 .stufe { border-color: var(--l3); color: var(--l3); }
.a-l4 .stufe { border-color: var(--l4); color: var(--l4); }
.a-lx .stufe { border-left-style: dashed; color: var(--grau); }
.a-lx .zahl { color: var(--grau); }
.satz { font-size: var(--t-22); font-weight: 600; line-height: 1.3; margin-top: var(--r-12); text-wrap: pretty; }
.wenig-text { margin-top: var(--r-8); font-size: var(--t-16); }
.pegel { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; margin-top: var(--r-24); }
.pegel-feld { display: grid; gap: 0.15rem; }
.pegel-feld i { display: block; height: 0.6rem; border: 1px solid var(--tinte); }
.pegel-feld.an i { border-color: transparent; background: inherit; }
.pegel-feld.an { background: none; }
.pegel-feld.f-bg-l1 i { background: var(--l1); } .pegel-feld.f-bg-l2 i { background: var(--l2); }
.pegel-feld.f-bg-l3 i { background: var(--l3); } .pegel-feld.f-bg-l4 i { background: var(--l4); }
.pegel-feld b { font-family: var(--mono); font-stretch: 87.5%; font-size: var(--t-12); font-weight: 600; }
.pegel-feld small { font-size: var(--t-12); color: var(--grau); line-height: 1.2; }
.a-lx .pegel-feld i { border-style: dashed; border-color: var(--grau); }
.pegel-erkl { font-size: var(--t-14); color: var(--grau); margin-top: var(--r-8); line-height: 1.45; }
.gerede-satz { margin-top: var(--r-16); padding-left: var(--r-12); border-left: 3px solid var(--att); font-size: var(--t-16); }
.frage { margin-top: var(--r-16); font-size: var(--t-14); color: var(--grau); }

/* Zwillings-Pegel: Messung gegen Gerede */
.zwilling { margin-top: var(--r-16); }
.zwilling-liste { display: grid; gap: 0.35rem; }
.zw-zeile { display: grid; grid-template-columns: 6.75rem minmax(0, 1fr); align-items: center; gap: var(--r-8); }
.zw-zeile dt { font-size: var(--t-14); line-height: 1.2; }
.zw-zeile dd { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--r-8); }
.zw-bahn { position: relative; display: block; height: 0.875rem; background: var(--band); border-bottom: 1px solid color-mix(in srgb, var(--tinte) 55%, transparent); }
.zw-wert { position: absolute; left: 0; top: 0; bottom: 0; display: block; }
.zw-att .zw-bahn { background: color-mix(in srgb, var(--att) 7%, var(--papier)); border-bottom-color: var(--att); }
.zw-att .zw-wert { background: repeating-linear-gradient(135deg, var(--att) 0 2px, color-mix(in srgb, var(--att) 25%, transparent) 2px 5px); }
.zw-wort { font-family: var(--mono); font-stretch: 87.5%; font-size: var(--t-12); font-weight: 600; min-width: 4.25rem; }
.zw-att .zw-wort { color: var(--att); }
.a-l1 .zw-mess .zw-wort { color: var(--l1); } .a-l2 .zw-mess .zw-wort { color: var(--l2); }
.a-l3 .zw-mess .zw-wort { color: var(--l3); } .a-l4 .zw-mess .zw-wort { color: var(--l4); }
.zw-hinweis { font-size: var(--t-14); color: var(--grau); margin-top: var(--r-8); }
.zw-hinweis a { color: var(--tinte); text-decoration-color: var(--att); }

/* Offizielle Meldungen: Kontext, kein Beleg */
.kontext { border: 1px dashed var(--linie); padding: var(--r-12) var(--r-16) var(--r-16); }
.kontext-erkl { font-size: var(--t-14); color: var(--grau); margin-bottom: var(--r-8); max-width: 40rem; }
.kontext li { padding: var(--r-8) 0; border-top: 1px solid var(--linie-fein); display: grid; gap: 0.1rem; }
.kontext-meta { font-family: var(--mono); font-stretch: 87.5%; font-size: var(--t-12); color: var(--grau); }
.mr-lernt { font-size: var(--t-14); color: var(--grau); }

/* ---------- Spuren ---------- */
.abschnitt { font-family: var(--mono); font-stretch: 87.5%; font-size: var(--t-12); font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: var(--r-12); }
.abschnitt-sub { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--grau); }

.achse, .spur-knopf, .summe {
  display: grid; grid-template-columns: var(--spalte-name) minmax(0, 1fr) var(--spalte-jetzt); align-items: stretch;
}
.achse { font-family: var(--mono); font-stretch: 87.5%; font-size: var(--t-12); color: var(--grau); height: 1.6rem; border-bottom: 1px solid var(--tinte); }
.achse-zeit { position: relative; }
.tick { position: absolute; bottom: 0; height: 0.4rem; border-left: 1px solid var(--grau); }
.tick-lab { position: absolute; bottom: 0.45rem; left: 0; transform: translateX(-50%); white-space: nowrap; }
.tick:not(.k2):not(.k4) .tick-lab { display: none; }
.tick.nah .tick-lab { display: none; }
.achse-jetzt { text-align: center; color: var(--tinte); font-weight: 700; border-left: 2px solid var(--tinte); align-self: stretch; padding-top: 0.15rem; }
@container (max-width: 44rem) { .tick.k2 .tick-lab { display: none; } }

.spurliste { border-bottom: 1px solid var(--linie); }
.spur { border-top: 1px solid var(--linie-fein); }
.spur:first-child { border-top: 0; }
.spur-knopf {
  width: 100%; min-height: calc(var(--bahn-h) + 0.5rem); padding: 0; background: none; border: 0; text-align: left; cursor: pointer;
}
.spur-knopf:focus-visible { outline-offset: -3px; }
.spur-name { display: grid; align-content: center; padding: var(--r-4) var(--r-12) var(--r-4) 0; min-width: 0; }
.spur-titel { font-size: var(--t-16); line-height: 1.25; }
.spur-sub { font-family: var(--mono); font-stretch: 87.5%; font-size: var(--t-12); color: var(--grau); }
.spur-knopf:hover .spur-titel { text-decoration: underline; text-underline-offset: 0.2em; }
.pfeil { display: inline-block; width: 0.45rem; height: 0.45rem; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); margin-left: 0.5rem; vertical-align: 0.1em; opacity: 0.7; }
.spur-knopf[aria-expanded='true'] .pfeil { transform: rotate(45deg); vertical-align: 0.25em; }
.spur-bahn { position: relative; background: var(--band); min-height: var(--bahn-h); }
.spur-knopf:hover .spur-bahn { background: var(--band-tief); }
.spur-bahn svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.spur-jetzt {
  display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 var(--r-8);
  font-family: var(--mono); font-stretch: 87.5%; font-size: var(--t-12); color: var(--grau);
  border-left: 2px solid var(--tinte);
}
.spur.aus .spur-titel { font-weight: 700; }
.spur.aus .spur-jetzt { color: var(--auf-farbe); font-weight: 700; background: var(--l0); }
.spur.aus.s-l1 .spur-jetzt { background: var(--l1); } .spur.aus.s-l2 .spur-jetzt { background: var(--l2); }
.spur.aus.s-l3 .spur-jetzt { background: var(--l3); } .spur.aus.s-l4 .spur-jetzt { background: var(--l4); }
.spur.leer .spur-bahn { background: transparent; border-top: 1px dashed var(--linie); border-bottom: 1px dashed var(--linie); }
.spur.leer .spur-titel { color: var(--grau); }
.leer-text { position: absolute; left: var(--r-8); top: 50%; transform: translateY(-50%); font-family: var(--mono); font-stretch: 87.5%; font-size: var(--t-12); color: var(--grau); }

/* SVG-Strich */
.tag { stroke: var(--tag); stroke-width: 1; vector-effect: non-scaling-stroke; }
.grenze { stroke: var(--grau); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; fill: none; }
.grenze-att { stroke: var(--att); }
.grund { stroke: color-mix(in srgb, var(--tinte) 55%, transparent); stroke-width: 1; vector-effect: non-scaling-stroke; }
.leer-linie { stroke: transparent; }
.linie { fill: none; stroke: var(--tinte); stroke-width: 1.25; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.f-ruhig { fill: var(--ruhig-fill); }
.spur .linie { stroke-width: 1; }
.stufe-linie { stroke: var(--linie); stroke-width: 1; stroke-dasharray: 1 3; vector-effect: non-scaling-stroke; }
.linie-att { fill: none; stroke: var(--att); stroke-width: 1.25; vector-effect: non-scaling-stroke; }
.f-att { fill: url(#schraffur); }
.f-att-leicht { fill: var(--att-leicht); }
.schraffur { stroke: var(--att); stroke-width: 3.5; }
.schraffur-grund { fill: color-mix(in srgb, var(--att) 22%, transparent); }

/* Summenspur */
.summe { margin-top: var(--r-4); border-top: 1px solid var(--tinte); border-bottom: 1px solid var(--tinte); }
.summe .spur-bahn { min-height: 4.25rem; }
.summe .spur-titel { font-weight: 700; }
.summe .spur-jetzt { color: var(--tinte); }
.summe .spur-jetzt b { font-size: var(--t-28); font-weight: 700; line-height: 1; }
.summe.s-l1 .spur-jetzt b { color: var(--l1); } .summe.s-l2 .spur-jetzt b { color: var(--l2); }
.summe.s-l3 .spur-jetzt b { color: var(--l3); } .summe.s-l4 .spur-jetzt b { color: var(--l4); }

.legende { display: flex; flex-wrap: wrap; gap: var(--r-8) var(--r-24); margin-top: var(--r-12); font-size: var(--t-14); color: var(--grau); }
.legende li { display: flex; align-items: center; gap: var(--r-8); }
.legende svg, .gerede-grenze svg { width: 1.75rem; height: 0.625rem; flex: none; }
.legende-farben { display: inline-flex; gap: 2px; flex: none; }
.legende-farben i { width: 0.55rem; height: 0.8rem; display: block; }

/* Messreihen (aufgeklappt) */
.messreihen { padding: var(--r-12) 0 var(--r-24); border-top: 1px dashed var(--linie); }
.messreihen[hidden] { display: none; }
.bereich-erkl { font-size: var(--t-14); color: var(--grau); margin-bottom: var(--r-12); }
.mr-raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr)); gap: var(--r-16) var(--r-24); }
.mr { border-top: 2px solid var(--linie); padding-top: var(--r-8); min-width: 0; }
.mr-aus { border-top-color: var(--l0); }
.mr-aus.mr-l1 { border-top-color: var(--l1); } .mr-aus.mr-l2 { border-top-color: var(--l2); }
.mr-aus.mr-l3 { border-top-color: var(--l3); } .mr-aus.mr-l4 { border-top-color: var(--l4); }
.mr-att.mr-aus { border-top-color: var(--att); }
.mr-kopf { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.15rem var(--r-8); align-items: baseline; }
.mr-name { font-size: var(--t-16); font-weight: 700; line-height: 1.3; }
.mr-klasse { font-family: var(--mono); font-stretch: 87.5%; font-size: var(--t-12); color: var(--grau); border: 1px solid var(--linie); padding: 0 0.35rem; white-space: nowrap; }
.mr-att .mr-klasse { color: var(--att); border-color: var(--att); }
.mr-plain { font-size: var(--t-14); color: var(--grau); margin-top: 0.15rem; }
.mr-werte { display: grid; grid-template-columns: auto auto; gap: var(--r-4) var(--r-16); margin-top: var(--r-8); justify-content: start; }
.mr-werte div { display: grid; align-content: start; }
.mr-werte .mr-abw { grid-column: 1 / -1; }
.mr-werte dt { font-family: var(--mono); font-stretch: 87.5%; font-size: var(--t-12); color: var(--grau); }
.mr-werte dd { font-size: var(--t-16); }
.mr-werte .zahl-mono { font-size: var(--t-14); font-weight: 600; }
.mr-abw dd { font-weight: 700; }
.mr-schw { display: block; font-weight: 400; font-size: var(--t-14); color: var(--grau); }
.mr-alt { font-size: var(--t-14); color: var(--grau); margin-top: var(--r-8); }
.mr-verlauf { margin-top: var(--r-8); }
.spark { width: 100%; height: 3rem; display: block; background: var(--band); }
.spark-linie { fill: none; stroke: var(--tinte); stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.spark-normal { stroke: var(--grau); stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
.spark-punkt { fill: var(--tinte); }
.mr-aus.mr-l1 .spark-punkt { fill: var(--l1); } .mr-aus.mr-l2 .spark-punkt { fill: var(--l2); }
.mr-aus.mr-l3 .spark-punkt { fill: var(--l3); } .mr-aus.mr-l4 .spark-punkt { fill: var(--l4); }
.mr-verlauf figcaption { font-family: var(--mono); font-stretch: 87.5%; font-size: var(--t-12); color: var(--grau); margin-top: 0.2rem; }
.mr-daempf { margin-top: var(--r-8); font-size: var(--t-14); border-left: 3px solid var(--grau); padding-left: var(--r-8); }
.mr-quelle { margin-top: var(--r-8); font-size: var(--t-14); }
.mr-quelle a { display: inline-block; padding: 0.35rem 0; }
.mr-geplant { margin-top: var(--r-12); font-size: var(--t-14); color: var(--grau); }

/* Aufmerksamkeit */
.gerede { margin-top: var(--r-32); padding-top: var(--r-16); border-top: 1px dashed var(--att); }
.gerede-titel { font-size: var(--t-16); font-weight: 700; display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--r-4) var(--r-12); }
.gerede-tag { font-family: var(--mono); font-stretch: 87.5%; font-size: var(--t-12); font-weight: 600; color: var(--att); border: 1px solid var(--att); padding: 0 0.4rem; text-transform: uppercase; letter-spacing: 0.05em; }

.spur-att.aus .spur-titel { color: var(--att); }

/* Belege */
.belege { border-top: 2px solid var(--tinte); padding-top: var(--r-12); }
.belege-bereich + .belege-bereich { margin-top: var(--r-24); }

/* ---------- Fuß ---------- */
.fuss { margin-top: var(--r-48); border-top: 1px solid var(--tinte); padding-top: var(--r-16); font-size: var(--t-14); }

// ---------- Formatierung ----------
const nfCache = new Map();
function nf(v, digits) {
  if (v == null || !Number.isFinite(v)) return '–';
  const a = Math.abs(v);
  const d = digits ?? (a >= 100 ? 0 : a >= 10 ? 1 : a >= 1 ? 2 : 3);
  if (!nfCache.has(d)) nfCache.set(d, new Intl.NumberFormat(LOCALE, { maximumFractionDigits: d }));
  return nfCache.get(d).format(v);
}

class LadeFehler extends Error { constructor(grund) { super(grund); this.grund = grund; } }

async function laden() {
  if (demo != null && !DEMOS.includes(demo)) throw new LadeFehler(L.fehler.grund.demo);
  // Einzeldatei-Fassung (scripts/build_single.py): der Snapshot ist in die Seite eingebettet, kein Abruf nötig.
  const eingebettet = !demo && globalThis.__SR_SNAPSHOT__;
  if (eingebettet) {
    if (eingebettet.schema !== 1 || !Array.isArray(eingebettet.scenarios) || !eingebettet.scenarios.length) throw new LadeFehler(L.fehler.grund.format);
    return eingebettet;
  }
  const url = demo ? `data/demo-${demo}.json` : 'data/snapshot.json';
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 15000);
  let res;
  try {
    res = await fetch(url, { cache: 'no-store', signal: ctrl.signal });
  } catch {
    throw new LadeFehler(L.fehler.grund.netz);
  } finally {
    clearTimeout(timer);
  }
  if (!res.ok) throw new LadeFehler(L.fehler.grund.http(res.status));
  let snap;
  try { snap = await res.json(); } catch { throw new LadeFehler(L.fehler.grund.format); }
  if (!snap || snap.schema !== 1 || !Array.isArray(snap.scenarios) || !snap.scenarios.length || !snap.generatedAt) {
    throw new LadeFehler(L.fehler.grund.format);
  }
  return snap;
}

function sortiere(domains) {
  return domains
    .map((d, i) => ({ d, i, daten: hatDaten(d) }))
    .sort((a, b) => (b.d.active - a.d.active) || (b.daten - a.daten) || (b.d.score - a.d.score) || (a.i - b.i))
    .map((x) => x.d);
}

// ---------- Spuren (SVG) ----------
const W = 1000;
const H = 100;
const PAD = 8; // Luft oben

function zeitachse(history) {
  const t = history.map((h) => Date.parse(h.t));
  const t0 = t[0];
  const t1 = t[t.length - 1];
  const x = (ms) => (t1 > t0 ? ((ms - t0) / (t1 - t0)) * W : W);
  return { t, t0, t1, x };
}

/** Tagesgrenzen (Mitternacht Ortszeit) zwischen t0 und t1 */
function tage(t0, t1) {
  const out = [];
  const d = new Date(t0);
  d.setHours(24, 0, 0, 0);
  while (d.getTime() < t1) { out.push(d.getTime()); d.setDate(d.getDate() + 1); }
  return out;
}

function rasterSvg(ax) {
  return tage(ax.t0, ax.t1).map((ms) => `<line class="tag" x1="${ax.x(ms).toFixed(1)}" x2="${ax.x(ms).toFixed(1)}" y1="0" y2="${H}"/>`).join('');
}

/** Stufen-Treppe: der Wert eines Punktes gilt für das Intervall, das an ihm endet. */
function spurSvg(history, ax, wert, opt = {}) {
  // wert(h) liefert den Spurwert 0..1; für Bereiche max(0,25 × Unruhe, Score)
  const grenze = opt.grenze ?? DOMAIN_ACTIVE;
  const y = (v) => H - (Math.min(Math.max(v, 0), 1) * (H - PAD));
  let rects = '';
  let line = `M0 ${H}`;
  for (let i = 1; i < history.length; i++) {
    const v = wert(history[i]) ?? 0;
    const x0 = ax.x(ax.t[i - 1]);
    const x1 = ax.x(ax.t[i]);
    line += ` L${x0.toFixed(1)} ${y(v).toFixed(1)} L${x1.toFixed(1)} ${y(v).toFixed(1)}`;
    if (v <= 0.002) continue;
    const cls = opt.aufmerksamkeit
      ? (v >= grenze ? 'f-att' : 'f-att-leicht')
      : (v >= grenze ? `f-l${history[i].level ?? 0}` : 'f-ruhig');
    rects += `<rect class="${cls}" x="${x0.toFixed(1)}" y="${y(v).toFixed(1)}" width="${(x1 - x0 + 0.4).toFixed(1)}" height="${(H - y(v)).toFixed(1)}"/>`;
  }
  const muster = opt.aufmerksamkeit
    ? `<defs><pattern id="schraffur" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="schraffur-grund" width="7" height="7"/><line class="schraffur" x1="0" y1="0" x2="0" y2="7"/></pattern></defs>`
    : '';
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true" focusable="false">${muster}
    ${rasterSvg(ax)}
    <line class="grenze${opt.aufmerksamkeit ? ' grenze-att' : ''}" x1="0" x2="${W}" y1="${y(grenze).toFixed(1)}" y2="${y(grenze).toFixed(1)}"/>
    ${rects}
    <path class="${opt.aufmerksamkeit ? 'linie-att' : 'linie'}" d="${line}"/>
    <line class="grund" x1="0" x2="${W}" y1="${H - 0.5}" y2="${H - 0.5}"/>
  </svg>`;
}

function leerSvg(ax) {
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true" focusable="false">
    ${ax ? rasterSvg(ax) : ''}<line class="leer-linie" x1="0" x2="${W}" y1="${H - 0.5}" y2="${H - 0.5}"/></svg>`;
}

function summeSvg(history, ax, max) {
  const y = (c) => H - (c / max) * (H - PAD);
  let bars = '';
  for (let i = 1; i < history.length; i++) {
    const c = history[i].activeDomains ?? 0;
    if (!c) continue;
    const x0 = ax.x(ax.t[i - 1]);
    const x1 = ax.x(ax.t[i]);
    bars += `<rect class="f-l${history[i].level ?? 0}" x="${x0.toFixed(1)}" y="${y(c).toFixed(1)}" width="${(x1 - x0 + 0.4).toFixed(1)}" height="${(H - y(c)).toFixed(1)}"/>`;
  }
  const lines = Array.from({ length: max }, (_, k) => `<line class="stufe-linie" x1="0" x2="${W}" y1="${y(k + 1).toFixed(1)}" y2="${y(k + 1).toFixed(1)}"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true" focusable="false">${rasterSvg(ax)}${lines}${bars}<line class="grund" x1="0" x2="${W}" y1="${H - 0.5}" y2="${H - 0.5}"/></svg>`;
}

function sparkSvg(sig) {
  const s = sig.spark;
  if (!s || s.length < 2) return '';
  const w = 240;
  const h = 48;
  const reif = !!sig.baseline?.mature;
  const vals = s.concat(reif ? [sig.baseline.center] : []);
  let lo = Math.min(...vals);
  let hi = Math.max(...vals);
  if (hi === lo) { hi += 1; lo -= 1; }
  const x = (i) => (i / (s.length - 1)) * (w - 6) + 1;
  const y = (v) => h - 4 - ((v - lo) / (hi - lo)) * (h - 8);
  const d = s.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const base = reif ? `<line class="spark-normal" x1="0" x2="${w}" y1="${y(sig.baseline.center).toFixed(1)}" y2="${y(sig.baseline.center).toFixed(1)}"/>` : '';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true" focusable="false">${base}<path class="spark-linie" d="${d}"/><circle class="spark-punkt" cx="${x(s.length - 1).toFixed(1)}" cy="${y(s[s.length - 1]).toFixed(1)}" r="3"/></svg>`;
}

// ---------- Messreihen ----------
function abweichung(sig) {
  if (!sig.baseline || !sig.baseline.mature) return L.abwNichtBewertbar;
  if (sig.value == null) return L.abw.unbekannt;
  const c = sig.baseline.center;
  if (!c) return L.abw.unbekannt;
  const f = sig.value / c;
  if (!Number.isFinite(f)) return L.abw.unbekannt;
  if (f >= 1.5) return L.abw.mal(nf(f, 1));
  const p = Math.round((f - 1) * 100);
  if (Math.abs(p) < 3) return L.abw.etwa;
  return p < 0 ? L.abw.weniger(nf(-p, 0)) : L.abw.mehr(nf(p, 0));
}

function schwankung(sig) {
  if (sig.z == null || !sig.baseline || !sig.baseline.mature) return '';
  const z = Math.abs(sig.z);
  return z < 2 ? L.schwankung.ruhig : L.schwankung.vielfach(nf(Math.round(z), 0));
}

function messreihe(sig, stufe) {
  const auf = sig.anomaly > 0 && sig.fresh;
  const klasse = L.klasse[sig.evidenceClass] ?? sig.evidenceClass;
  let werte;
  if (sig.fresh && sig.value != null) {
    const normal = sig.baseline
      ? (sig.baseline.mature ? mitEinheitRoh(sig.baseline.center, sig.unit) : L.normalImAufbau(sig.baseline.n))
      : L.normalFehlt;
    const schw = schwankung(sig);
    werte = `<dl class="mr-werte">
        <div><dt>${L.wertJetzt}</dt><dd class="zahl-mono">${mitEinheit(sig.value, sig.unit)}</dd></div>
        <div><dt>${L.wertNormal}</dt><dd class="${sig.baseline?.mature ? 'zahl-mono' : 'mr-lernt'}">${esc(normal)}</dd></div>
        <div class="mr-abw"><dt>${L.wertAbw}</dt><dd>${esc(abweichung(sig))}${schw ? `<span class="mr-schw">${esc(schw)}</span>` : ''}</dd></div>
      </dl>`;
  } else {
    werte = `<p class="mr-alt">${esc(L.nichtFrisch(sig.ts ? kurz(sig.ts) : ''))}</p>`;
  }
  const spark = sparkSvg(sig);
  const verlauf = spark ? `<figure class="mr-verlauf">${spark}<figcaption>${esc(L.verlauf(kurz(sig.sparkStart), kurz(sig.sparkEnd), !!sig.baseline?.mature))}</figcaption></figure>` : '';
  const daempf = sig.damp ? `<p class="mr-daempf">${esc(L.gedaempft(sig.damp.reason))}</p>` : '';
  const quelle = sig.sourceUrl
    ? `<p class="mr-quelle"><a href="${esc(sig.sourceUrl)}" rel="noopener noreferrer external">${esc(L.rohdaten(sig.sourceName || sig.sourceUrl))}<span class="nur-vorleser"> ${L.externHinweis}</span></a></p>`
    : '';
  return `<article class="mr${auf ? ` mr-aus mr-l${stufe}` : ''}${sig.evidenceClass === 'D' ? ' mr-att' : ''}">
      <header class="mr-kopf"><h4 class="mr-name">${esc(sig.name)}</h4><span class="mr-klasse">${esc(klasse)}</span></header>
      <p class="mr-plain">${esc(sig.plain)}</p>
      ${werte}${verlauf}${daempf}${quelle}
    </article>`;
}

function messreihenBlock(sigs, stufe, opt = {}) {
  const g = gebaut(sigs).sort((a, b) => (b.anomaly - a.anomaly) || (b.fresh - a.fresh));
  const rest = sigs.filter((s) => s.status !== 'active');
  const schluessel = rest.filter((s) => s.status === 'needs-key').length;
  const karten = g.map((s) => messreihe(s, stufe)).join('');
  const leer = g.length ? '' : `<p class="mr-alt">${L.nurGeplant}</p>`;
  const geplant = rest.length && !opt.ohneGeplant ? `<p class="mr-geplant">${esc(L.weitereGeplant(rest.length, schluessel))}</p>` : '';
  return `${leer}<div class="mr-raster">${karten}</div>${geplant}`;
}

// ---------- Zustand ----------
const zustand = { snap: null, id: null, offen: new Set(), erstesBild: true };

function aktuellesSzenario() {
  const s = zustand.snap.scenarios;
  return s.find((x) => x.id === zustand.id) ?? s[0];
}

// ---------- Kopf, Hinweise, Wahl ----------
function renderBetrieb(snap) {
  const b = $('betrieb');
  const m = L.betrieb[snap.mode] ?? L.betrieb.live;
  if (snap.mode === 'live') { b.hidden = true; return; }
  b.hidden = false;
  b.className = `betrieb betrieb-${snap.mode}`;
  b.innerHTML = `<p><strong>${esc(m.kurz)}</strong> <span>${esc(m.lang)}</span>${snap.note ? ` <span class="betrieb-notiz">${esc(snap.note)}</span>` : ''}</p>`;
}

function renderKopf(snap) {
  const live = snap.mode === 'live';
  $('stand').innerHTML = `${live ? `<span class="live-marke">${esc(L.betrieb.live.kurz)}</span> ` : ''}<time datetime="${esc(snap.generatedAt)}">${esc(L.stand(zeit(snap.generatedAt)))}</time>`;
  const h = (Date.now() - Date.parse(snap.generatedAt)) / 3600000;
  $('hinweise').innerHTML = live && h > STALE_H
    ? `<p class="veraltet" role="status">${esc(L.veraltet(L.dauer(Math.floor(h))))}</p>`
    : '';
  document.body.classList.toggle('ist-veraltet', live && h > STALE_H);
}

function miniPegel(sc) {
  const wenig = wenigDaten(sc);
  return `<span class="mini${wenig ? ' mini-wenig' : ''}" aria-hidden="true">${[1, 2, 3, 4].map((k) => `<i class="${!wenig && sc.level >= k ? `an f-bg-l${sc.level}` : ''}"></i>`).join('')}</span>`;
}

function renderWahl(snap) {
  const nav = $('wahl');
  nav.hidden = false;
  const ids = new Set(snap.scenarios.map((s) => s.id));
  const kommend = Object.entries(L.kommend).filter(([id]) => !ids.has(id)).map(([, name]) => name);
  nav.innerHTML = `<div class="wahl" role="tablist" aria-label="${esc(L.szenarien)}">
      ${snap.scenarios.map((sc) => {
        const wenig = wenigDaten(sc);
        const an = sc.id === aktuellesSzenario().id;
        return `<button type="button" role="tab" class="wahl-knopf w-l${wenig ? 'x' : sc.level}" id="tab-${esc(sc.id)}" aria-selected="${an}" aria-controls="lage" tabindex="${an ? 0 : -1}" data-id="${esc(sc.id)}">
          <span class="wahl-titel">${esc(sc.title)}</span>
          <span class="wahl-stufe">${miniPegel(sc)}<span>${esc(wenig ? L.wenigDaten : L.stufeKurz(sc.level, stufeName(sc)))}</span></span>
        </button>`;
      }).join('')}
    </div>
    ${kommend.length ? `<p class="wahl-kommend">${esc(L.inVorbereitung(kommend.join(', ')))}</p>` : ''}`;

  const tabs = [...nav.querySelectorAll('[role="tab"]')];
  tabs.forEach((tab, i) => {
    tab.addEventListener('click', () => waehle(tab.dataset.id, true));
    tab.addEventListener('keydown', (e) => {
      const ziel = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
      if (ziel == null) return;
      e.preventDefault();
      const t = tabs[(ziel + tabs.length) % tabs.length];
      t.focus();
      waehle(t.dataset.id, true);
    });
  });
}

function waehle(id, nutzer) {
  if (!zustand.snap.scenarios.some((s) => s.id === id) || id === zustand.id) return;
  zustand.id = id;
  zustand.offen.clear();
  zustand.erstesBild = false;
  history.replaceState(null, '', `${location.pathname}${location.search}#${encodeURIComponent(id)}`);
  for (const t of document.querySelectorAll('[role="tab"]')) {
    const an = t.dataset.id === id;
    t.setAttribute('aria-selected', String(an));
    t.tabIndex = an ? 0 : -1;
  }
  renderLage();
  renderFuss();
  if (nutzer) {
    const sc = aktuellesSzenario();
    $('ansage').textContent = L.ansageWahl(sc.title, wenigDaten(sc) ? L.wenigDaten : L.stufeKurz(sc.level, stufeName(sc)));
  }
}

// ---------- Lage ----------
function aussage(sc) {
  const wenig = wenigDaten(sc);
  const alle = sc.domains.length;
  const ohne = sc.domains.filter((d) => !hatDaten(d)).length;
  const lvl = wenig ? 'x' : sc.level;
  const gap = L.gerede[sc.rumorGap] ?? '';
  return `<div class="aussage a-l${lvl}">
      <h2 class="nur-vorleser">${esc(L.lageTitel(sc.title))}</h2>
      <p class="zaehler"><span class="zahl">${wenig ? sc.coverage.domainsWithData : sc.activeDomains}</span><span class="zahl-text">${esc(wenig ? L.zahlTextWenig(alle) : L.zahlText(alle))}</span></p>
      ${ohne && !wenig ? `<p class="ohne-daten">${esc(L.zahlOhneDaten(ohne))}</p>` : ''}
      <p class="stufe"><span class="stufe-nr">${esc(wenig ? L.wenigDatenStufe : L.stufe(sc.level))}</span><span class="stufe-name">${esc(wenig ? L.wenigDaten : stufeName(sc))}</span></p>
      <p class="satz">${esc(sc.verdict)}</p>
      ${wenig ? `<p class="wenig-text">${esc(L.wenigDatenText)}</p>` : ''}
      ${zwilling(sc, wenig, gap)}
      <div class="pegel" role="img" aria-label="${esc(wenig ? L.wenigDaten : L.pegelLabel(sc.level))}">
        ${[1, 2, 3, 4].map((k) => `<span class="pegel-feld${!wenig && sc.level >= k ? ` an f-bg-l${sc.level}` : ''}"><i></i><b>${k}</b><small>${esc(L.stufen[k])}</small></span>`).join('')}
      </div>
      <p class="pegel-erkl">${esc(L.pegelErkl)}</p>

      <p class="frage">${esc(sc.question)}</p>
    </div>`;
}

function zwilling(sc, wenig, gap) {
  const Z = L.zwilling;
  const attDaten = (sc.attentionSignals ?? []).some((s) => s.status === 'active' && s.fresh);
  const m = wenig ? 0 : Math.max(0, Math.min(1, sc.score));
  const a = attDaten ? Math.max(0, Math.min(1, sc.attention)) : 0;
  const mWort = wenig ? Z.keineDaten : Z.messWort(sc.level, stufeName(sc));
  const aWort = attDaten ? Z.geredeWort(sc.attention) : Z.keineDaten;
  return `<div class="zwilling">
      <dl class="zwilling-liste" aria-label="${esc(Z.label)}">
        <div class="zw-zeile zw-mess"><dt>${Z.messung}</dt><dd><span class="zw-bahn" aria-hidden="true"><span class="zw-wert f-bg-l${wenig ? 0 : sc.level}" data-w="${(m * 100).toFixed(1)}"></span></span><span class="zw-wort">${esc(mWort)}</span></dd></div>
        <div class="zw-zeile zw-att"><dt>${Z.gerede}</dt><dd><span class="zw-bahn" aria-hidden="true"><span class="zw-wert" data-w="${(a * 100).toFixed(1)}"></span></span><span class="zw-wort">${esc(aWort)}</span></dd></div>
      </dl>
      <p class="zw-hinweis">${gap && sc.rumorGap !== 'talk-no-data' ? `${esc(gap)} ` : ''}${Z.hinweis} <a href="#att-titel">${Z.zurSpur}</a></p>
    </div>`;
}

function achse(ax) {
  if (!ax) return '';
  const ticks = tage(ax.t0, ax.t1).map((ms) => {
    const d = new Date(ms);
    const pos = (ax.x(ms) / W) * 100;
    const k = d.getDate() % 4 === 0 ? ' k4' : d.getDate() % 2 === 0 ? ' k2' : '';
    const nahJetzt = pos > 90 || pos < 4 ? ' nah' : '';
    return `<span class="tick${k}${nahJetzt}" data-pos="${pos.toFixed(2)}"><span class="tick-lab">${esc(tagFmt.format(d))}</span></span>`;
  }).join('');
  return `<div class="achse" aria-hidden="true"><span class="achse-name"></span><span class="achse-zeit">${ticks}</span><span class="achse-jetzt">${L.jetzt}</span></div>`;
}

function spur(d, sc, ax) {
  const daten = hatDaten(d);
  const g = gebaut(d.signals).length;
  const geplant = d.signals.length - g;
  const zust = !daten ? (g ? L.keineFrischen : L.keineReihe) : d.active ? L.ausschlag : L.normal;
  const jetztKurz = !daten ? L.keineDaten : d.active ? L.ausschlag : L.normal;
  const sub = [g ? L.reihen(g) : '', geplant ? L.geplant(geplant) : ''].filter(Boolean).join(' · ');
  const offen = zustand.offen.has(d.id);
  const lvl = sc.level;
  const bahn = daten && ax ? spurSvg(sc.history, ax, (h) => Math.max(DOMAIN_ACTIVE * (h.u?.[d.id] ?? 0), h.d?.[d.id] ?? 0)) : leerSvg(ax);
  return `<li class="spur${d.active ? ` aus s-l${lvl}` : ''}${daten ? '' : ' leer'}">
      <button type="button" class="spur-knopf" aria-expanded="${offen}" aria-controls="mr-${esc(d.id)}" aria-label="${esc(L.spurLabel(d.title, zust, g ? L.reihen(g) : L.keineReihe))}">
        <span class="spur-name"><span class="spur-titel">${esc(d.title)}<i class="pfeil" aria-hidden="true"></i></span><span class="spur-sub">${esc(sub)}</span></span>
        <span class="spur-bahn">${bahn}${daten ? '' : `<span class="leer-text">${esc(zust)}</span>`}</span>
        <span class="spur-jetzt">${esc(jetztKurz)}</span>
      </button>
      <div class="messreihen" id="mr-${esc(d.id)}"${offen ? '' : ' hidden'}>
        ${d.plain ? `<p class="bereich-erkl">${esc(d.plain)}</p>` : ''}
        ${messreihenBlock(d.signals, lvl)}
      </div>
    </li>`;
}

function summe(sc, ax) {
  if (!ax) return '';
  const counts = sc.history.map((h) => h.activeDomains ?? 0);
  const max = Math.max(4, ...counts);
  const maxVorher = Math.max(...counts);
  return `<div class="spur summe s-l${sc.level}" role="img" aria-label="${esc(L.gleichzeitigLabel(sc.activeDomains, maxVorher))}">
      <span class="spur-name"><span class="spur-titel">${L.gleichzeitig}</span><span class="spur-sub">${L.gleichzeitigSub}</span></span>
      <span class="spur-bahn">${summeSvg(sc.history, ax, max)}</span>
      <span class="spur-jetzt"><b>${wenigDaten(sc) ? '–' : sc.activeDomains}</b></span>
    </div>`;
}

function legende() {
  return `<ul class="legende">
      <li><svg viewBox="0 0 28 10" aria-hidden="true"><line class="grenze" x1="0" x2="28" y1="5" y2="5"/></svg>${esc(L.legende.grenze)}</li>
      <li><svg viewBox="0 0 28 10" aria-hidden="true"><path class="linie" d="M0 9 L5 9 L5 6 L10 6 L10 8 L16 8 L16 4 L21 4 L21 9 L28 9"/></svg>${esc(L.legende.unruhe)}</li>
      <li><span class="legende-farben" aria-hidden="true"><i class="f-bg-l0"></i><i class="f-bg-l1"></i><i class="f-bg-l2"></i><i class="f-bg-l3"></i><i class="f-bg-l4"></i></span>${esc(L.legende.farbe)}</li>
      <li class="legende-tippen">${esc(L.legende.tippen)}</li>
    </ul>`;
}

function aufmerksamkeit(sc, ax) {
  const sigs = sc.attentionSignals ?? [];
  const daten = sigs.some((s) => s.status === 'active' && s.fresh);
  const viel = sc.attention >= ATT_HIGH;
  const zust = !daten ? L.keineDaten : viel ? L.attViel : L.attNormal;
  const offen = zustand.offen.has('__att');
  const g = gebaut(sigs).length;
  const bahn = daten && ax ? spurSvg(sc.history, ax, (h) => h.attention, { aufmerksamkeit: true, grenze: ATT_HIGH }) : leerSvg(ax);
  return `<section class="gerede" aria-labelledby="att-titel">
      <h3 class="gerede-titel" id="att-titel">${L.aufmerksamkeit} <span class="gerede-tag">${L.aufmerksamkeitTag}</span></h3>
      <p class="gerede-erkl">${esc(L.aufmerksamkeitErkl)}</p>
      <ul class="spurliste">
        <li class="spur spur-att${viel && daten ? ' aus' : ''}${daten ? '' : ' leer'}">
          <button type="button" class="spur-knopf" aria-expanded="${offen}" aria-controls="mr-att" aria-label="${esc(L.spurLabel(L.aufmerksamkeit, zust, g ? L.reihen(g) : L.keineReihe))}">
            <span class="spur-name"><span class="spur-titel">${L.aufmerksamkeit}<i class="pfeil" aria-hidden="true"></i></span><span class="spur-sub">${esc(g ? L.reihen(g) : L.keineReihe)}</span></span>
            <span class="spur-bahn">${bahn}${daten ? '' : `<span class="leer-text">${esc(L.keineDaten)}</span>`}</span>
            <span class="spur-jetzt">${esc(zust)}</span>
          </button>
          <div class="messreihen" id="mr-att"${offen ? '' : ' hidden'}>${messreihenBlock(sigs, 0)}</div>
        </li>
      </ul>
      <p class="gerede-grenze"><svg viewBox="0 0 28 10" aria-hidden="true"><line class="grenze grenze-att" x1="0" x2="28" y1="5" y2="5"/></svg>${esc(L.aufmerksamkeitGrenze)}</p>
    </section>`;
}

function belege(sc) {
  const wenig = wenigDaten(sc);
  const aktiv = sc.domains.filter((d) => d.active);
  let inhalt;
  if (wenig) inhalt = `<p class="belege-leer">${esc(L.belegeWenig)}</p>`;
  else if (!aktiv.length) inhalt = `<p class="belege-leer">${esc(L.belegeLeer)}</p>`;
  else {
    inhalt = sortiere(aktiv).map((d) => {
      const sigs = gebaut(d.signals).filter((s) => s.anomaly > 0 && s.fresh);
      return `<section class="belege-bereich"><h3>${esc(d.title)}</h3><div class="mr-raster">${sigs.map((s) => messreihe(s, sc.level)).join('')}</div></section>`;
    }).join('');
  }
  return `<section class="belege" aria-labelledby="belege-titel"><h2 id="belege-titel" class="abschnitt">${L.belege}</h2>${inhalt}</section>`;
}

function kontext(sc) {
  const items = sc.context ?? [];
  if (!items.length) return '';
  return `<section class="kontext" aria-labelledby="kontext-titel">
      <h2 id="kontext-titel" class="abschnitt">${esc(L.kontext)}</h2>
      <p class="kontext-erkl">${esc(L.kontextErkl)}</p>
      <ul>${items.map((c) => `<li><a href="${esc(c.url)}" rel="noopener noreferrer external">${esc(c.title)}<span class="nur-vorleser"> ${L.externHinweis}</span></a><span class="kontext-meta">${esc(c.source)} · ${esc(kurz(c.ts))}</span></li>`).join('')}</ul>
    </section>`;
}

function renderLage() {
  const sc = aktuellesSzenario();
  const ax = sc.history && sc.history.length > 1 ? zeitachse(sc.history) : null;
  const doms = sortiere(sc.domains);
  const main = $('inhalt');
  main.setAttribute('aria-busy', 'false');
  main.innerHTML = `<div class="lage${zustand.erstesBild ? ' zeichnen' : ''}" id="lage" role="tabpanel" aria-labelledby="tab-${esc(sc.id)}">
      ${aussage(sc)}
      <section class="spuren" aria-labelledby="spuren-titel">
        <h2 class="abschnitt" id="spuren-titel">${L.spuren} <span class="abschnitt-sub">${L.spurenSub}</span></h2>
        ${ax ? '' : `<p class="mr-alt">${L.keinVerlauf}</p>`}
        ${achse(ax)}
        <ul class="spurliste">${doms.map((d) => spur(d, sc, ax)).join('')}</ul>
        ${summe(sc, ax)}
        ${legende()}
        ${aufmerksamkeit(sc, ax)}
      </section>
      ${belege(sc)}
      ${kontext(sc)}
    </div>`;
  for (const t of main.querySelectorAll('.tick')) t.style.left = `${t.dataset.pos}%`;
  for (const w of main.querySelectorAll('.zw-wert')) w.style.width = `${Math.max(Number(w.dataset.w), 1.5)}%`;
  for (const b of main.querySelectorAll('.spur-knopf')) b.addEventListener('click', () => umschalten(b));
}

function umschalten(b) {
  const panel = $(b.getAttribute('aria-controls'));
  const auf = panel.hidden;
  panel.hidden = !auf;
  b.setAttribute('aria-expanded', String(auf));
  const key = b.getAttribute('aria-controls') === 'mr-att' ? '__att' : b.getAttribute('aria-controls').slice(3);
  if (auf) zustand.offen.add(key); else zustand.offen.delete(key);
}

// ---------- Fuß ----------
function renderFuss() {
  const snap = zustand.snap;
  const sc = aktuellesSzenario();
  const F = L.fuss;
  $('fuss').innerHTML = `
    <div class="fuss-raster">
      <div class="fuss-block">
        <p class="fuss-zahl"><span class="zahl-mono">${pctFmt.format(sc.confidence)}</span> ${F.vertrauen}</p>
        <p>${esc(F.vertrauenErkl)}</p>
        <p class="fuss-zahl"><span class="zahl-mono">${sc.coverage.fresh}/${sc.coverage.active}</span> ${F.abdeckung}</p>
        <p>${esc(F.abdeckungText(sc.coverage))}</p>
      </div>
      <div class="fuss-block">
        <h2 class="fuss-titel">${F.methodeTitel}</h2>
        <p class="fuss-wichtig">${esc(F.keineWkt)}</p>
        <p>${F.methode.map(esc).join(' ')}</p>
        <p>${esc(F.empfindlichkeit[snap.sensitivity] ?? '')}</p>
      </div>
      <div class="fuss-block">
        <h2 class="fuss-titel">${F.vorsorgeTitel}</h2>
        <p>${esc(F.vorsorge)}</p>
        <p><a href="https://www.bbk.bund.de/" rel="noopener noreferrer external">${F.vorsorgeLink}<span class="nur-vorleser"> ${L.externHinweis}</span></a></p>
      </div>
    </div>
    <p class="fuss-projekt">${esc(F.projekt)}</p>`;
}

// ---------- Fehler ----------
function renderFehler(e) {
  const main = $('inhalt');
  main.setAttribute('aria-busy', 'false');
  $('wahl').hidden = true;
  $('stand').textContent = '';
  const grund = e instanceof LadeFehler ? e.grund : L.fehler.grund.format;
  main.innerHTML = `<section class="fehler" role="alert">
      <h2>${esc(L.fehler.titel)}</h2>
      <p>${esc(grund)} ${esc(L.fehler.text)}</p>
      <p class="fehler-aktionen"><button type="button" id="erneut" class="knopf">${esc(L.fehler.erneut)}</button>
      <a href="?demo=calm" class="fehler-demo">${esc(L.fehler.demo)}</a></p>
    </section>`;
  $('erneut').addEventListener('click', () => location.reload());
  if (!(e instanceof LadeFehler)) console.warn(e);
}

// ---------- Start ----------
async function start() {
  try {
    const snap = await laden();
    zustand.snap = snap;
    const wunsch = decodeURIComponent(location.hash.slice(1));
    zustand.id = snap.scenarios.some((s) => s.id === wunsch) ? wunsch : snap.scenarios[0].id;
    renderBetrieb(snap);
    renderKopf(snap);
    renderWahl(snap);
    renderLage();
    renderFuss();
    window.addEventListener('hashchange', () => waehle(decodeURIComponent(location.hash.slice(1)), false));
  } catch (e) {
    renderFehler(e);
  }
}

start();

</script>
</head>
<body>
<a class="sprung" href="#inhalt">Zum Inhalt springen</a>
<div id="betrieb" class="betrieb" hidden></div>
<div class="seite">
  <header class="kopf">
    <p class="marke"><svg class="marke-zeichen" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path class="mz-t" d="M3 9.5h20"/><path class="mz-a" d="M3 17h15l2.5-5.5L23 17"/><path class="mz-a" d="M3 24.5h16l2-4 2 4"/><path class="mz-t" d="M27 5v22"/></g></svg><span>Signal Radar</span></p>
    <p id="stand" class="stand"></p>
  </header>
  <div id="hinweise"></div>
  <nav id="wahl" class="wahl-rahmen" aria-label="Szenarien" hidden></nav>
  <main id="inhalt" class="inhalt" tabindex="-1" aria-busy="true">
    <div class="laden" role="status">
      <p class="laden-text">Messwerte werden geladen …</p>
      <div class="laden-spuren" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <noscript><p class="noscript">Diese Anzeige braucht JavaScript, um die Messdaten zu laden. Die Rohdaten liegen als Datei unter <a href="data/snapshot.json">data/snapshot.json</a>.</p></noscript>
  </main>
  <footer id="fuss" class="fuss"></footer>
</div>
<p id="ansage" class="nur-vorleser" aria-live="polite"></p>
</body>
</html>
