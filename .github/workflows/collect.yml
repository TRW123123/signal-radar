# Live operation without a server: collect every 15 minutes, commit the raw data, rebuild the snapshot.
# Every data point stays auditable in git history. Enable by pushing this repository to GitHub.
name: collect
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  # also after code or catalog changes, so new fields reach the live snapshot at once
  push:
    branches: [master]
    paths: ['src/**', 'catalog/**', '.github/workflows/collect.yml']
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect and score
        run: node src/cli.ts run --respect-intervals --prune-days 120
        env:
          SR_SENSITIVITY: high
          # Gelesen von gebauten Collectors: alle unten außer ENTSOE, ACLED, OPENSKY (geplant) und NASA_FIRMS (alter Alias von FIRMS). NVD ist optional (ohne Key langsamer). Ohne Wert wird übersprungen (kein Fehler).
          SR_CLOUDFLARE_KEY: ${{ secrets.SR_CLOUDFLARE_KEY }}
          SR_ABUSECH_KEY: ${{ secrets.SR_ABUSECH_KEY }}
          SR_SEC_USER_AGENT: ${{ secrets.SR_SEC_USER_AGENT }}
          SR_FRED_KEY: ${{ secrets.SR_FRED_KEY }}
          SR_AGSI_KEY: ${{ secrets.SR_AGSI_KEY }}
          SR_ALSI_KEY: ${{ secrets.SR_ALSI_KEY }}
          SR_EIA_KEY: ${{ secrets.SR_EIA_KEY }}
          SR_FIRMS_KEY: ${{ secrets.SR_FIRMS_KEY }}
          SR_NASA_FIRMS_KEY: ${{ secrets.SR_FIRMS_KEY }}
          SR_NVD_KEY: ${{ secrets.SR_NVD_KEY }}
          SR_ENTSOE_KEY: ${{ secrets.SR_ENTSOE_KEY }}
          SR_ACLED_KEY: ${{ secrets.SR_ACLED_KEY }}
          SR_OPENSKY_KEY: ${{ secrets.SR_OPENSKY_KEY }}
          SR_GITHUB_KEY: ${{ secrets.SR_GITHUB_KEY || github.token }}
          SR_OTX_KEY: ${{ secrets.SR_OTX_KEY }}
          SR_AISSTREAM_KEY: ${{ secrets.SR_AISSTREAM_KEY }}
          SR_FAA_NOTAM_USER: ${{ secrets.SR_FAA_NOTAM_USER }}
          SR_FAA_NOTAM_PASS: ${{ secrets.SR_FAA_NOTAM_PASS }}
          SR_SPACE_TRACK_USER: ${{ secrets.SR_SPACE_TRACK_USER }}
          SR_SPACE_TRACK_PASS: ${{ secrets.SR_SPACE_TRACK_PASS }}
          SR_GFW_KEY: ${{ secrets.SR_GFW_KEY }}
          SR_ALERTS_IN_UA_KEY: ${{ secrets.SR_ALERTS_IN_UA_KEY }}
          SR_FINGRID_KEY: ${{ secrets.SR_FINGRID_KEY }}
          SR_COINGECKO_KEY: ${{ secrets.SR_COINGECKO_KEY }}
          SR_METACULUS_KEY: ${{ secrets.SR_METACULUS_KEY }}
          SR_SAM_GOV_KEY: ${{ secrets.SR_SAM_GOV_KEY }}
          SR_REDDIT_USER: ${{ secrets.SR_REDDIT_USER }}
          SR_REDDIT_PASS: ${{ secrets.SR_REDDIT_PASS }}
      - name: Commit data
        run: |
          git config user.name "signal-radar-bot"
          git config user.email "signal-radar-bot@users.noreply.github.com"
          git add data frontend/data/snapshot.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          # other pushes may arrive while collecting: retry instead of losing the run
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 7))
          done
          exit 1
