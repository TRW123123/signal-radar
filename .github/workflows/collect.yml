# Live operation without a server: collect every 15 minutes, commit the raw data, rebuild the snapshot.
# Every data point stays auditable in git history. Enable by pushing this repository to GitHub.
name: collect
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect and score
        run: node src/cli.ts run --respect-intervals
        env:
          SR_SENSITIVITY: high
          SR_CLOUDFLARE_KEY: ${{ secrets.SR_CLOUDFLARE_KEY }}
          SR_NVD_KEY: ${{ secrets.SR_NVD_KEY }}
          SR_FRED_KEY: ${{ secrets.SR_FRED_KEY }}
          SR_ENTSOE_KEY: ${{ secrets.SR_ENTSOE_KEY }}
          SR_ACLED_KEY: ${{ secrets.SR_ACLED_KEY }}
          SR_OPENSKY_KEY: ${{ secrets.SR_OPENSKY_KEY }}
      - name: Commit data
        run: |
          git config user.name "signal-radar-bot"
          git config user.email "signal-radar-bot@users.noreply.github.com"
          git add data frontend/data/snapshot.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
